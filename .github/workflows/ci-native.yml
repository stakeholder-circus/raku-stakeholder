name: ci-native

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install Rakudo
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends raku
      - name: Compiler proof
        run: make compiler-proof
      - name: Syntax analysis
        run: make analyze
      - name: Deterministic CLI tests
        run: make test
