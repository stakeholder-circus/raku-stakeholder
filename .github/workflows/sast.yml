name: sast

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  raku-syntax-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Rakudo
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends raku
      - name: Compile-check runtime
        run: raku -c bin/stakeholder.raku
